<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/overview" aria-label="Member Portal home">
      <span class="brand-mark" aria-hidden="true">MP</span>
      <span>{{ title }}</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a routerLink="/overview" routerLinkActive="active">Overview</a>
      <a routerLink="/claims" routerLinkActive="active">Claims</a>
    </nav>

    <button class="profile-button" type="button" aria-label="Open account menu">
      {{ memberInitial }}
    </button>
  </header>

  <router-outlet></router-outlet>
</div>
